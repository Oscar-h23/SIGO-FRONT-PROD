<main class="auth-page"><form class="auth-card" (ngSubmit)="guardar()"><div class="logo">SIGO</div><h1>Cambia tu contraseña</h1><p>Por seguridad debes crear una contraseña personal antes de continuar.</p><label>Contraseña actual<input type="password" name="actual" [(ngModel)]="actual"></label><label>Nueva contraseña<input type="password" name="nueva" [(ngModel)]="nueva"></label><label>Confirmar nueva contraseña<input type="password" name="confirmar" [(ngModel)]="confirmar"></label>@if(error()){<div class="error">{{error()}}</div>}<button [disabled]="loading()">{{loading()?'Guardando...':'Cambiar contraseña'}}</button></form></main>
