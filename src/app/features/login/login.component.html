<main class="auth-page"><form class="auth-card" (ngSubmit)="entrar()"><div class="logo">SIGO</div><h1>Iniciar sesión</h1><p>Gestión Operativa · Lima Expresa</p><label>Código de trabajador<input type="number" name="codigo" [(ngModel)]="codigo" autocomplete="username" required></label><label>Contraseña<input type="password" name="password" [(ngModel)]="password" autocomplete="current-password" required></label>@if(error()){<div class="error">{{error()}}</div>}<button [disabled]="loading()">{{loading()?'Ingresando...':'Ingresar'}}</button></form></main>
